<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi MTsN 2 Kota Tangerang</title>
  <link rel="icon" type="image/png" href="logo_mts.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <!-- Main Card Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    
    <!-- Header Section -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6 sm:p-8 text-center relative">
      <!-- Decorative Elements -->
      <div class="absolute -top-10 -right-10 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
      <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>

      <!-- Icon / Logo Sekolah -->
      <div class="inline-flex items-center gap-3 mb-3">
        <img src="logo3.png" alt="Logo Kementerian Agama" class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 shrink-0 object-contain drop-shadow-lg">
        <img src="logo_mts.png" alt="Logo MTs Negeri 2 Kota Tangerang" class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 shrink-0 object-contain drop-shadow-lg">
      </div>
      
      <h1 class="text-xl font-bold tracking-wide">MTsN 2 KOTA TANGERANG</h1>
      <p class="text-xs text-emerald-100 mt-1">Sistem Informasi Presensi Guru & Siswa</p>
    </div>

    <!-- Form Section -->
    <div class="p-6 sm:p-8">
      <div class="mb-6 text-center">
        <h2 class="text-lg font-semibold text-slate-800">Selamat Datang</h2>
        <p class="text-xs text-slate-500 mt-0.5">Silakan masuk menggunakan akun Anda</p>
      </div>

      <!-- Alert Notification (Hidden by default) -->
      <div id="alertError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2 text-xs text-red-600">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span id="alertText">Username atau password salah!</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        
        <!-- Role Selection Tabs -->
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1.5">Masuk Sebagai</label>
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl text-xs font-medium">
            <button type="button" id="roleGuruBtn" onclick="setRole('Guru')" 
              class="py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-white text-blue-700 shadow-sm">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
              Guru / Wali
            </button>
            <button type="button" id="roleAdminBtn" onclick="setRole('Admin')" 
              class="py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all text-slate-500 hover:text-slate-700">
              <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
              Admin Piket
            </button>
          </div>
          <!-- Hidden Input Role -->
          <input type="hidden" id="selectedRole" value="Guru">
        </div>

        <!-- Input Username / NIP -->
        <div>
          <label for="username" class="block text-xs font-medium text-slate-700 mb-1">Username / NIP</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" id="username" required 
              class="w-full pl-9 pr-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all" 
              placeholder="Masukkan Username atau NIP">
          </div>
        </div>

        <!-- Input Password -->
        <div>
          <label for="password" class="block text-xs font-medium text-slate-700 mb-1">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" id="password" required 
              class="w-full pl-9 pr-8 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
              placeholder="••••••••">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
              <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center text-slate-600 cursor-pointer">
            <input type="checkbox" class="w-3.5 h-3.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span class="ml-1.5">Ingat saya</span>
          </label>
          <a href="#" onclick="alert('Silakan hubungi Admin Sekolah/TU untuk reset password.')" class="text-blue-600 hover:underline font-medium">Lupa Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmit" 
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-xs rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 mt-2">
          <span>Masuk ke Sistem</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <!-- Footer Info -->
      <div class="mt-8 text-center border-t border-slate-100 pt-4">
        <p class="text-[10px] text-slate-400">
          &copy; 2026 MTs Negeri 2 Kota Tangerang. All rights reserved.
        </p>
      </div>

    </div>
  </div>

  <!-- JavaScript Logika UI Interaktif -->
  <script>
    // Inisialisasi Lucide Icons
    lucide.createIcons();

    // Fungsi Ganti Tab Role (Guru / Admin)
    function setRole(role) {
      document.getElementById('selectedRole').value = role;
      const guruBtn = document.getElementById('roleGuruBtn');
      const adminBtn = document.getElementById('roleAdminBtn');

      if (role === 'Guru') {
        guruBtn.className = "py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-white text-blue-700 shadow-sm";
        adminBtn.className = "py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all text-slate-500 hover:text-slate-700";
      } else {
        adminBtn.className = "py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all bg-white text-blue-700 shadow-sm";
        guruBtn.className = "py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all text-slate-500 hover:text-slate-700";
      }
    }

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Simulasi Handle Form Submit
    function handleLogin(event) {
      event.preventDefault();
      
      const role = document.getElementById('selectedRole').value;
      const username = document.getElementById('username').value;
      const btn = document.getElementById('btnSubmit');

      // State Loading
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memproses...`;
      lucide.createIcons();

      // Simulasi panggilan API ke Google Apps Script
      setTimeout(() => {
        // Nanti di sini ditaruh logika autentikasi fetch() ke Apps Script
        console.log(`Logging in as ${role}: ${username}`);
        
        // Contoh redirect jika sukses
        if (role === 'Admin') {
          window.location.href = 'AbsensiGuru.html'; // Contoh Halaman Khusus Admin
        } else {
          window.location.href = 'Absensi.html'; // Halaman Absensi Siswa
        }
      }, 1500);
    }
  </script>
</body>
</html>
